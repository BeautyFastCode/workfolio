---
# Development environment override
#
# Use together with compose.yaml (make up).
#
x-dev-runtime: &dev-runtime
  image: ${IMAGES_PREFIX:-}app-php-dev
  build:
    context: ..
    dockerfile: .infrastructure/Dockerfile
    target: frankenphp_dev
  environment: &dev-environment
    APP_ENV: "${APP_ENV:-dev}"
  volumes:
    - ../:/app
  labels:
    deployment.environment: dev

services:
  php:
    <<: *dev-runtime
    volumes:
      - ../:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      <<: *dev-environment
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  php-scheduler:
    <<: *dev-runtime

  php-worker:
    <<: *dev-runtime

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - workfolio

volumes:
  mailpit_data:
