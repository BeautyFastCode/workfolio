---
name: workfolio

x-app-environment: &app-environment
  SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
  DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
  MERCURE_ISSUER: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
  MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
  MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
  MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
  MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
  MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
  SYMFONY_VERSION: ${SYMFONY_VERSION:-}
  STABILITY: ${STABILITY:-stable}

x-app-labels: &app-labels
  logging.enabled: 'true'
  service.group: workfolio
  service.runtime: frankenphp

services:
  php:
    labels:
      <<: *app-labels
      service.name: workfolio-php
      service.component: web
    restart: unless-stopped
    environment:
      <<: *app-environment
      # Logging directly to stderr of process PID 1
      MONOLOG_STREAM: /proc/1/fd/2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    networks:
      - workfolio

  php-scheduler:
    labels:
      <<: *app-labels
      service.name: workfolio-php-scheduler
      service.component: scheduler
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: '0'
      <<: *app-environment
    healthcheck:
      test: [ "NONE" ] # todo: add healthcheck
    command: php bin/console messenger:consume scheduler_default -vv
    depends_on:
      - php
    deploy:
      replicas: 1
    networks:
      - workfolio

  php-worker:
    labels:
      <<: *app-labels
      service.name: workfolio-php-worker
      service.component: worker
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: '0'
      <<: *app-environment
    healthcheck:
      test: [ "NONE" ] # todo: add healthcheck
    command: php bin/console messenger:consume async -vv
    depends_on:
      - php
    deploy:
      replicas: 1
    networks:
      - workfolio

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

volumes:
  caddy_data:
  caddy_config:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

networks:
  workfolio: ~
