doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Contact:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Contact/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Contact\Shared\Infrastructure\Persistence\Doctrine\Entity'
                alias: Contact
            CallToAction:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CallToAction/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\CallToAction\Shared\Infrastructure\Persistence\Doctrine\Entity'
                alias: CallToAction
            Content:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Content/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Content\Shared\Infrastructure\Persistence\Doctrine\Entity'
                alias: Content
            Portfolio:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Portfolio/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Portfolio\Shared\Infrastructure\Persistence\Doctrine\Entity'
                alias: Portfolio
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Identity\Shared\Infrastructure\Persistence\Doctrine\Entity'
                alias: Identity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
